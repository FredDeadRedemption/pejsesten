[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
miniquad = "0.4"
egui-macroquad = "0.17.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ewebsock = "0.6"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
