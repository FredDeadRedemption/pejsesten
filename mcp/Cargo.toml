[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
rmcp = { version = "3.6.0", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
