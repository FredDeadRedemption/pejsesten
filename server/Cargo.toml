[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
# forces the prod tuning in a debug build; release builds use it anyway
settings-prod = []

[dependencies]
shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10.1"
tokio = { version = "1.52.1", features = ["full"] }
axum = "0.8.9"
socketioxide = { version = "0.18.3", features = ["state"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
