[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10.1"
tokio = { version = "1.52.1", features = ["full"] }
axum = "0.8.9"
socketioxide = { version = "0.18.3", features = ["state"] }
tower-http = { version = "0.6.8", features = ["cors"] }
ts-rs = "12.0.1"

[package.metadata.ts-rs]
export-to = "../client/src/lib/shared/generated/"